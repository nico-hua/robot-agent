[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent"
version = "0.1.0"
description = "Configurable OpenAI-compatible LLM provider layer."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=3.11.0",
    "pydantic>=2.9",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {src = "src"}
packages = ["src", "src.config", "src.providers", "src.tools", "src.tools.builtin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
